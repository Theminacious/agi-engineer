[pytest]
# Repository-level pytest configuration.
#
# Why this file exists, and why neither test directory has an __init__.py:
#   `tests/` and `backend/tests/` are both importable as the top-level package
#   name `tests`, because `pythonpath` below puts BOTH the repository root and
#   `backend/` on sys.path and each of those contains a `tests/` directory.
#   While the two directories carried `__init__.py` markers, pytest resolved
#   each conftest by walking up the package chain to the topmost `__init__.py`
#   and naming it relative to a sys.path entry — so both resolved to the same
#   module name `tests.conftest`:
#
#     tests/conftest.py          -> root on sys.path     -> "tests.conftest"
#     backend/tests/conftest.py  -> backend/ on sys.path -> "tests.conftest"
#
#   Whichever was imported second collided with the first. On pytest 7.x this
#   surfaced as ImportPathMismatchError; on pytest 8.x collection aborts with
#   "ValueError: Plugin already registered under a different name", so the suite
#   did not run at all in a fresh environment.
#
#   `--import-mode=importlib` is necessary but NOT sufficient on its own: with
#   `__init__.py` present it still derives the name from the package chain. With
#   the markers removed it derives module names from the rootdir-relative path
#   ("tests.conftest" vs "backend.tests.conftest"), giving the two test trees
#   distinct identities with no sys.path mutation.
#
#   Do not add `__init__.py` back to either test directory. importlib mode does
#   not need it, and it reintroduces the collision above.
#   Guarded by backend/tests/test_test_environment.py.

# Discover both test trees from the repository root.
testpaths =
    backend/tests
    tests

# Unique module identity per file path; no implicit sys.path insertion.
addopts = --import-mode=importlib

# importlib mode does not prepend basedirs to sys.path, so the import roots are
# declared here rather than via PYTHONPATH exports or sys.path hacks in
# conftest.py. Resolved relative to rootdir (this file's directory).
#   backend -> lets `backend/tests/conftest.py` do `from app.db.base import Base`
#   .       -> lets tests import the top-level `agent` package
# NOTE: `agent` is deliberately NOT listed. Putting it on sys.path would make
# its submodules importable under two names (`intelligence.x` and
# `agent.intelligence.x`), producing duplicate module objects.
pythonpath =
    .
    backend

# Keep collection out of vendored, generated and fixture-repository trees.
norecursedirs =
    .git
    .venv
    venv
    node_modules
    frontend
    real-repos
    repos
    .pytest_cache
    .ruff_cache
    .mypy_cache
    __pycache__
    .next
    build
    dist
